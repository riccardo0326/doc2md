[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "0.1.0"
description = "Tiered PDF to Markdown converter"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "reportlab>=4,<6",
    "ruff>=0.6,<1",
]

[project.scripts]
doc2md = "doc2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: tests that load heavy document-processing models",
    "kelpie: tests that call the real Kelpie service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
follow_imports = "normal"
ignore_missing_imports = true
